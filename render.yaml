services:
  - type: web
    name: verisight-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key:EVALUATION_DASHBOARD_ENABLED
        value: "false"